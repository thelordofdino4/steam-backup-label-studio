[package]
name = "sbls-package-codec"
version = "0.1.0"
description = "Pure, bounded Steam Backup Label Studio project-package codec"
edition = "2021"
rust-version = "1.77.2"
publish = false
build = "build.rs"
license = "MIT AND BSD-3-Clause AND IJG"

[lib]
name = "sbls_package_codec"
path = "src/lib.rs"

[dependencies]
base64 = "=0.22.1"
crc32fast = "=1.5.0"
miniz_oxide = { version = "=0.8.9", default-features = false }
ryu-js = "=1.0.2"
sha2 = "=0.10.9"

[build-dependencies]
cc = "=1.2.62"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
sha2 = "=0.10.9"
tar = "=0.4.44"
