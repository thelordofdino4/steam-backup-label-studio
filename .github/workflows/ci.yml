name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check dependency cycles
        run: npm run check:cycles

      - name: Build frontend
        run: npm run build

  node-tests:
    name: Node behavioral and boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install headless component-test browser
        run: npx playwright install --with-deps chromium

      - name: Verify complete test discovery
        run: npm run test:discovery

      - name: Run all discovered Node tests
        run: npm run test:node

  tauri-check:
    name: Tauri Rust check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js for the authoritative native test runner
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: Test application and package codec on Windows
        run: npm run test:rust
