<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" role="img" aria-label="Linux platform mark placeholder">
  <title>Linux platform mark placeholder</title>
  <defs>
    <filter id="placeholder-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.4" stdDeviation="3.4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#placeholder-shadow)">
    <rect x="2" y="2" width="116" height="76" rx="7" fill="#111827" fill-opacity="0.88" stroke="#f9fafb" stroke-opacity="0.92" stroke-width="4"/>
    <text x="60" y="40" fill="#f9fafb" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900">LINUX</text>
  </g>
</svg>
