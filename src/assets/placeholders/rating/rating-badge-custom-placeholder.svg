<svg xmlns="http://www.w3.org/2000/svg" width="90" height="130" viewBox="0 0 90 130" role="img" aria-label="Generic custom rating badge asset">
  <title>Generic custom rating badge asset</title>
  <defs>
    <filter id="placeholder-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.4" stdDeviation="3.4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#placeholder-shadow)">
    <rect x="2" y="2" width="86" height="126" rx="6" fill="#111827" stroke="#f9fafb" stroke-width="4"/>
    <text x="45" y="25" fill="#f9fafb" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800">custom</text>
    <text x="45" y="106" fill="#f9fafb" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800">GENERIC</text>
  </g>
