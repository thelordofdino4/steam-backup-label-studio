<svg xmlns="http://www.w3.org/2000/svg" width="90" height="130" viewBox="0 0 90 130" role="img" aria-label="PEGI rating badge placeholder">
  <title>PEGI rating badge placeholder</title>
  <defs>
    <filter id="placeholder-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.4" stdDeviation="3.4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#placeholder-shadow)">
    <circle cx="45" cy="65" r="43" fill="#f9fafb" stroke="#111827" stroke-width="4"/>
    <text x="45" y="25" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800">PEGI</text>
    <text x="45" y="106" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="800">PLACEHOLDER</text>
  </g>
</svg>
