<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disc guided navigation integration harness</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      :root {
        --integration-section-scroll-inset: 16px;
      }

      main {
        display: grid;
        grid-template-columns: 320px 500px;
        gap: 24px;
      }

      main > aside {
        height: 320px;
        overflow-y: auto;
        padding: 16px;
      }

      [data-role-id] {
        margin-bottom: 16px;
      }

      [data-role-id] > details > summary,
      [data-nested-panel] > details > summary {
        display: block;
        min-height: 48px;
        padding: 12px;
      }

      .panel-content {
        padding: 8px 12px 16px;
      }

      [data-nested-panel] > details,
      [data-nested-panel].editor-nested-panel {
        margin-top: 12px;
        scroll-margin-block-start: var(--integration-section-scroll-inset);
      }

      [data-nested-panel="publisher"] {
        margin-bottom: 240px;
      }

      #integration-media-format {
        display: block;
        margin-bottom: 240px;
      }

      [aria-label="Guided preview actions"] {
        position: relative;
        width: 500px;
        height: 500px;
      }

      .disc-guided-placeholder-action-layer {
        position: absolute;
        inset: 0;
      }

      .disc-guided-placeholder-action {
        position: absolute;
      }

      .disc-guided-placeholder-setup-popover {
        position: fixed;
        top: 100px !important;
        left: 600px !important;
        transform: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__guidedNavigationEvents = []

      const describeElement = (element) => ({
        id: element.id || null,
        roleId: element.closest('[data-role-id]')?.dataset.roleId || null,
        nestedPanel:
          element.closest('[data-nested-panel]')?.dataset.nestedPanel || null,
        isSummary: element.tagName === 'SUMMARY',
        isSection: element.matches(
          '[data-nested-panel] > details, [data-nested-panel].editor-nested-panel',
        ),
      })
      const nativeFocus = HTMLElement.prototype.focus
      const nativeScrollIntoView = Element.prototype.scrollIntoView

      HTMLElement.prototype.focus = function focus(options) {
        window.__guidedNavigationEvents.push({
          type: 'focus',
          ...describeElement(this),
          preventScroll: options?.preventScroll === true,
        })
        const result = nativeFocus.call(this, options)

        if (this.dataset.simulateFocusScroll === 'nearest') {
          const sidebar = this.closest('main')?.querySelector(':scope > aside')

          if (sidebar) {
            const scrollTopBefore = sidebar.scrollTop
            sidebar.scrollTop = Math.min(
              sidebar.scrollHeight - sidebar.clientHeight,
              sidebar.scrollTop + sidebar.clientHeight / 2,
            )
            window.__guidedNavigationEvents.push({
              type: 'simulated-focus-scroll',
              ...describeElement(this),
              scrollTopBefore,
              scrollTopAfter: sidebar.scrollTop,
            })
          }
        }

        return result
      }

      Element.prototype.scrollIntoView = function scrollIntoView(options) {
        const sidebar = this.closest('main')?.querySelector(':scope > aside')
        const scrollTopBefore = sidebar?.scrollTop ?? null
        const result = nativeScrollIntoView.call(this, options)
        const elementRect = this.getBoundingClientRect()
        const sidebarRect = sidebar?.getBoundingClientRect()
        window.__guidedNavigationEvents.push({
          type: 'scroll',
          ...describeElement(this),
          block: options?.block || null,
          behavior: options?.behavior || null,
          scrollTopBefore,
          scrollTopAfter: sidebar?.scrollTop ?? null,
          elementTopAfter: elementRect.top,
          sidebarTop: sidebarRect?.top ?? null,
        })
        return result
      }
    </script>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { DiscGuidedNavigationIntegrationHarness } from './DiscGuidedNavigationIntegrationHarness.tsx'

      createRoot(document.getElementById('root')).render(
        React.createElement(DiscGuidedNavigationIntegrationHarness),
      )
    </script>
  </body>
</html>
